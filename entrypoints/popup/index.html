<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading Resume</title>
  </head>
  <body>
    <a class="skip" href="#main">Skip to controls</a>
    <main id="main">
      <header><span class="mark" aria-hidden="true">⌁</span><div><p class="eyebrow">Sentence coordinate</p><h1>Reading Resume</h1></div></header>
      <section class="state" aria-labelledby="page-title">
        <p class="state-label" id="state-label">Checking this page…</p>
        <h2 id="page-title">Current page</h2>
        <blockquote id="sentence" hidden></blockquote>
        <p id="message" role="status" aria-live="polite">Finding readable text and any saved place.</p>
      </section>
      <div class="primary-actions">
        <button id="resume" class="accent" disabled>Return to sentence</button>
        <button id="save" disabled>Save this place</button>
      </div>
      <div class="secondary-actions">
        <button id="strip" disabled>Open reading strip</button>
        <button id="speech" disabled>Read aloud</button>
      </div>
      <section class="recent" aria-labelledby="recent-title">
        <div class="section-title"><h2 id="recent-title">Recent places</h2><span>On this device</span></div>
        <ul id="recent-list"><li class="empty">No places saved yet.</li></ul>
      </section>
      <footer><button id="settings" class="link-button">Reading settings</button><span aria-hidden="true">·</span><a href="https://dyslexia-reading-resume.sociobot.in/privacy" target="_blank">Privacy</a></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
